<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Schwebende Insel – 3D-Map</title>
<meta name="description" content="Stilisierte 3D-Fantasy-Insel (Three.js) — TRELLIS.2 Asset-Kit">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2833; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(10px, env(safe-area-inset-top)) 14px 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .title {
    color: #fff; text-shadow: 0 1px 6px rgba(0,40,60,.55);
    font-weight: 700; font-size: clamp(15px, 2.6vw, 22px); letter-spacing: .3px;
  }
  .title small { display:block; font-weight: 400; opacity: .85; font-size: .62em; }
  #refBtn {
    pointer-events: auto; border: 0; border-radius: 999px;
    background: rgba(10,60,80,.55); color: #fff; backdrop-filter: blur(6px);
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  #refBtn:active { transform: scale(.96); }
  .hint {
    position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.75); font-size: 12px;
    font-family: system-ui, sans-serif; text-shadow: 0 1px 4px rgba(0,40,60,.6);
    pointer-events: none;
  }
  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(180deg, #9fd3e2, #cfeef4);
    color: #0d3d52; font-family: system-ui, sans-serif; font-size: 15px;
    z-index: 10; transition: opacity .4s;
  }
  #barWrap { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: rgba(13,61,82,.18); overflow: hidden; }
  #bar { height: 100%; width: 0; background: #0d89a8; border-radius: 3px; transition: width .2s; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="title">Schwebende Insel<small>Three.js · TRELLIS.2-Assets</small></div>
  <button id="refBtn" type="button">Referenz-Ansicht</button>
</div>
<div class="hint">Ziehen: Drehen · Scrollen/Pinchen: Zoomen</div>

<div id="loader">
  <div id="loaderText">Lade Insel …</div>
  <div id="barWrap"><div id="bar"></div></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
